name: Sports Data Update

on:
workflow\_dispatch:

permissions:
contents: write

jobs:
update\-data:
runs\-on: ubuntu\-latest

```
steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set up Python
    uses: actions/setup-python@v5
    with:
      python-version: "3.12"

  - name: Install dependencies
    run: |
      pip install -r requirements.txt

  - name: Create database tables
    run: |
      python data/database.py

  - name: Fetch NBA data
    env:
      SPORTS_API_KEY: ${{ secrets.SPORTS_API_KEY }}
    run: |
      python data/fetch_nba.py

  - name: Fetch player statistics
    env:
      SPORTS_API_KEY: ${{ secrets.SPORTS_API_KEY }}
    run: |
      python data/fetch_player_stats.py

  - name: Export player statistics
    run: |
      python data/export_player_stats.py

  - name: Commit updated player statistics
    run: |
      git config user.name "github-actions[bot]"
      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      git add data/historical/player_stats.csv
      git diff --cached --quiet || git commit -m "Update player statistics"
      git push
```
